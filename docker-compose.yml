version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: alim_postgres
    environment:
      POSTGRES_USER: alim
      POSTGRES_PASSWORD: alim_pass
      POSTGRES_DB: alim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
