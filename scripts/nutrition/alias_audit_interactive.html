
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1rem 0; }
.tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 6px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; background: var(--color-background-secondary); color: var(--color-text-secondary); }
.tab.active { background: var(--color-background-primary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; }
.stat-n { font-size: 22px; font-weight: 500; }
.stat-l { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.s-ok .stat-n { color: var(--color-text-success); }
.s-warn .stat-n { color: var(--color-text-warning); }
.s-bad .stat-n { color: var(--color-text-danger); }
.s-miss .stat-n { color: var(--color-text-secondary); }
.search { width: 100%; padding: 8px 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 13px; background: var(--color-background-primary); color: var(--color-text-primary); margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 6px 8px; border-bottom: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); font-weight: 500; font-size: 12px; }
td { padding: 7px 8px; border-bottom: 0.5px solid var(--color-border-tertiary); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.b-ok { background: var(--color-background-success); color: var(--color-text-success); }
.b-warn { background: var(--color-background-warning); color: var(--color-text-warning); }
.b-bad { background: var(--color-background-danger); color: var(--color-text-danger); }
.b-miss { background: var(--color-background-secondary); color: var(--color-text-secondary); }
.note { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }
.chain { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; font-family: var(--font-mono); }
.warn-icon { color: var(--color-text-warning); margin-right: 4px; }
.empty { color: var(--color-text-tertiary); font-size: 13px; padding: 2rem 0; text-align: center; }
</style>

  {a:"yogurt_plant", t:"yogurt", s:"proxy", note:"Yaourt végétal → yaourt générique. Acceptable — protéines légèrement différentes."},
  {a:"coconut", t:"coconut_oil", s:"warn", note:"Coconut générique → huile de coco. Si l'ingrédient est de la chair de coco (fat ~33g) vs huile (fat ~100g), erreur énorme. Noix de coco ≠ huile de coco."},
  {a:"coconut_aminos", t:"soy_sauce_(made_from_soy)", s:"proxy", note:"Amino de coco ≈ sauce soja (même usage, umami). Sodium légèrement plus faible. Acceptable."},
  {a:"fried_onion", t:"onion", s:"warn", note:"Oignon frit (fat ~25g, cal ~400) → oignon frais (fat ~0.1g, cal ~40). Erreur calorique ×10."},
  {a:"fried_rice", t:"rice", s:"proxy", note:"Riz frit → riz. Correct comme proxy de base."},
  {a:"jalapeno", t:"bell_pepper_red", s:"proxy", note:"Jalapeño ≈ poivron rouge pimenté. Capsaïcine non capturée mais macros proches. Acceptable."},
  {a:"kaffir_lime_leaf", t:"bay_leaf", s:"warn", note:"Feuille de combava (citrus hystrix, agrume asiatique, huiles essentielles spécifiques) → feuille de laurier (Laurus nobilis). Deux aromates distincts, botanique différente. Proxy feuille aromatique acceptable si usage est symbolique."},
  {a:"nut", t:"walnut", s:"proxy", note:"Type ombrelle noix → noix commune. Raisonnable comme proxy générique."},
];

const counts = {ok:0, warn:0, bad:0, proxy:0};
DATA.forEach(d => counts[d.s]++);
document.getElementById('n-ok').textContent = counts.ok;
document.getElementById('n-warn').textContent = counts.warn;
document.getElementById('n-bad').textContent = counts.bad;
document.getElementById('n-miss').textContent = counts.proxy;

let curFilter = 'all';

function filter(f) {
  curFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('srch').value.toLowerCase();
  const tbody = document.getElementById('tbody');
  const rows = DATA.filter(d => {
    if (curFilter !== 'all' && d.s !== curFilter) return false;
    if (q && !d.a.toLowerCase().includes(q) && !d.t.toLowerCase().includes(q)) return false;
    return true;
  });
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4"><div class="empty">Aucun résultat</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(d => {
    const badge = d.s === 'ok' ? '<span class="badge b-ok">parfait</span>'
      : d.s === 'warn' ? '<span class="badge b-warn">faux bon match</span>'
      : d.s === 'bad' ? '<span class="badge b-bad">raté</span>'
      : '<span class="badge b-miss">proxy</span>';
    return `<tr>
      <td><code style="font-size:12px;font-family:var(--font-mono)">${d.a}</code></td>
      <td><code style="font-size:12px;font-family:var(--font-mono);color:var(--color-text-secondary)">${d.t}</code></td>
      <td>${badge}</td>
      <td><span style="font-size:12px;color:var(--color-text-secondary)">${d.note}</span></td>
    </tr>`;
  }).join('');
}

render();
</script>
