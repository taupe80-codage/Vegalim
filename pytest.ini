[pytest]
# ── Configuration pytest ALIM v6 ──────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Affichage
addopts =
    -q
    --tb=short
    --strict-markers

# Markers personnalisés
markers =
    pipeline: test qui nécessite que le pipeline nutrition ait été exécuté (données générées)
    integration: test d'intégration HTTP (nécessite uvicorn + DB)
    slow: test lent (> 5s)
